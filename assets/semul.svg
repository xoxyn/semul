<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-label="semul tree mascot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ground shadow -->
  <ellipse cx="100" cy="200" rx="54" ry="8" fill="#000" opacity="0.08"/>

  <!-- trunk -->
  <path d="M80 200 Q90 192 92 170 L93 110 L107 110 L108 170 Q110 192 120 200 Z" fill="#8B5E3C"/>
  <!-- trunk shading -->
  <path d="M100 112 L100 196" stroke="#6F4A2E" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- thorns (semul trunks are famously prickly) -->
  <g fill="#6F4A2E">
    <polygon points="93,140 86,144 93,148"/>
    <polygon points="107,152 114,156 107,160"/>
    <polygon points="92,164 85,168 92,172"/>
    <polygon points="108,174 115,178 108,182"/>
  </g>

  <!-- canopy -->
  <g>
    <circle cx="68"  cy="90" r="28" fill="#F48FB1"/>
    <circle cx="132" cy="90" r="28" fill="#F48FB1"/>
    <circle cx="80"  cy="54" r="25" fill="#F9A8C9"/>
    <circle cx="120" cy="54" r="25" fill="#F9A8C9"/>
    <circle cx="100" cy="70" r="38" fill="#F9A8C9"/>
    <circle cx="100" cy="100" r="28" fill="#F48FB1"/>
    <!-- highlights -->
    <circle cx="82"  cy="48" r="9" fill="#FDD3E4" opacity="0.8"/>
    <circle cx="124" cy="60" r="6" fill="#FDD3E4" opacity="0.8"/>
  </g>

  <!-- face -->
  <g>
    <ellipse cx="88"  cy="86" rx="3.5" ry="4.5" fill="#4A2A3A"/>
    <ellipse cx="112" cy="86" rx="3.5" ry="4.5" fill="#4A2A3A"/>
    <circle cx="89.2"  cy="84.5" r="1.2" fill="#fff"/>
    <circle cx="113.2" cy="84.5" r="1.2" fill="#fff"/>
    <ellipse cx="79"  cy="95" rx="6" ry="3.5" fill="#EC6A9C" opacity="0.55"/>
    <ellipse cx="121" cy="95" rx="6" ry="3.5" fill="#EC6A9C" opacity="0.55"/>
    <path d="M94 94 Q100 101 106 94" stroke="#4A2A3A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- falling leaves -->
  <g fill="#F48FB1">
    <ellipse cx="38"  cy="140" rx="6" ry="3" transform="rotate(-35 38 140)"/>
    <ellipse cx="162" cy="128" rx="6" ry="3" transform="rotate(30 162 128)"/>
    <ellipse cx="150" cy="174" rx="5" ry="2.5" transform="rotate(-20 150 174)" opacity="0.8"/>
    <ellipse cx="52"  cy="178" rx="5" ry="2.5" transform="rotate(25 52 178)" opacity="0.8"/>
  </g>
</svg>
